name: taning
description: Know your taning. Make time visible.
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  
  # Navigation
  go_router: ^14.2.1
  
  # Database
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.5
  path: ^1.9.0
  
  # Date/Time
  intl: ^0.19.0
  timezone: ^0.9.4
  
  # UI
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  
  # Utilities
  uuid: ^4.4.2
  equatable: ^2.0.7
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  
  # Platform
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2
  shared_preferences: ^2.3.2
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.13.1

  # Android widgets (Glance)
  glance: ^0.6.0

  # Notifications
  flutter_local_notifications: ^17.2.3

  # Background processing
  workmanager: ^0.10.9
  
  # Firebase
  firebase_core: ^3.10.0
  firebase_crashlytics: ^4.2.0
  firebase_analytics: ^11.4.0

  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Code Generation
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  riverpod_generator: ^2.6.3
  analyzer: ^7.6.0  # FIXED: Updated to working version
  
  # Database Generation
  drift_dev: ^2.21.0
  
  # Testing
  mockito: ^5.4.4
  network_image_mock: ^2.1.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
  
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#4F46E5"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#4F46E5"
  image: assets/images/splash_logo.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
  fullscreen: true