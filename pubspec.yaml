name: Taning
description: Know your taning. Make time visible.
version: 1.0.0+1
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Core
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Navigation
  go_router: ^13.2.0
  
  # Database
  drift: ^2.15.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.2
  path: ^1.9.0
  
  # Date/Time
  intl: ^0.18.1
  timezone: ^0.9.2
  
  # UI
  flutter_svg: ^2.0.9
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  
  # Utilities
  uuid: ^4.3.3
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  
  # Platform
  device_info_plus: ^9.1.2
  package_info_plus: ^5.0.1
  shared_preferences: ^2.2.2
  flutter_native_splash: ^2.3.10
  flutter_launcher_icons: ^0.13.1
  
  # Notifications
  flutter_local_notifications: ^17.0.0
  
  # Firebase (Optional - for future)
  firebase_core: ^2.29.0
  firebase_crashlytics: ^3.4.9
  firebase_analytics: ^10.8.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  
  # Code Generation
  build_runner: ^2.4.8
  freezed: ^2.4.5
  riverpod_generator: ^2.3.9
  
  # Database Generation
  drift_dev: ^2.15.0
  
  # Testing
  mockito: ^5.4.4
  network_image_mock: ^2.1.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
  
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700

flutter_native_splash:
  color: "#4F46E5"
  image: assets/images/splash_logo.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 23